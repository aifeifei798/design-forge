name: pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "tools/build-docs.mjs"
      - "skill/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: rebuild docs from source of truth
        run: node tools/build-docs.mjs

      - name: docs must pass our own linter
        run: node skill/scripts/forge.mjs docs/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
